<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your email</title>
</head>
<body style="margin:0; padding:0; background-color:#ffffff;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding:24px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               style="max-width:600px; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:1.5; color:#3c3c3c;">
          <tr>
            <td align="center" style="padding-bottom:32px;">
              <img src="cid:logo" alt="Videoflix" width="240" style="display:block; width:240px; max-width:100%; height:auto; border:0;">
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:24px;">
              Dear <span style="color:#2e3edf;">{{ name }}</span>,<br>
              Thank you for registering with <span style="color:#2e3edf;">Videoflix</span>.
              To complete your registration and verify your email address, please click the link below:
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:24px;">
              <a href="{{ link }}"
                 style="display:inline-block; padding:12px 24px; background-color:#2e3edf; color:#ffffff; font-weight:bold; text-decoration:none; border-radius:40px;">Activate account</a>
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:16px;">If you did not create an account with us, please disregard this email.</td>
          </tr>
          <tr>
            <td style="padding-bottom:16px;">Best regards,</td>
          </tr>
          <tr>
            <td>Your Videoflix Team.</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
